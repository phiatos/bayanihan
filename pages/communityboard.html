<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../components/sidebar.css" />
  <link rel="stylesheet" href="../css/communityboard.css">
  <link rel="stylesheet" href="../css/global.css" />
  <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'/>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  
  <!-- Firebase SDK v9 with compatibility mode -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <title>Bayanihan | Angat Buhay Disaster Relief Portal</title>
</head>
<body>
  <div class="main-container">
    <div class="sidebar-placeholder"></div>
    <div id="main-content-cb">
      <header>Community Board</header>
      <div class="post-container">
        <div class="post-creator">
          <div class="post-buttons">
            <button id="sort-posts-button"><i class='bx bx-sort-up'></i>Sort Posts</button>
            <button class="post-option" data-type="text" style="padding-left: 10px;"><i class='bx bx-text'></i> Text</button>
            <button class="post-option" data-type="image"><i class='bx bx-image'></i> Image</button>
            <button class="post-option" data-type="video"><i class='bx bx-video'></i> Video</button>
            <button class="post-option" data-type="link"><i class='bx bx-link'></i> Link</button>
          </div>
        </div>
        <div class="post-created">
          <div class="post-container-header">
            <select id="category-filter">
              <option value="all">All Categories</option>
              <option value="announcement">Announcement</option>
              <option value="event">Event</option>
              <option value="resource">Resource</option>
              <option value="discussion">Discussion</option>
            </select>
          </div>
          <div id="posts">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

      <div class="vertical-divider"></div>
      <div class="activity-panel">
        <h3>Activity</h3>
        <ul id="activity-log"></ul>
      </div>
    </div>

    <!-- Modal for post creation -->
    <div id="post-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header-container">
          <div class="modal-header">
            <div class="modal-user-info">
              <strong id="modal-user-name">Loading...</strong>
              <small id="modal-user-org" style="color: black;"></small>
            </div>
            <span class="close-button" id="post-modal-close">×</span>
          </div>
        </div>
        <div class="modal-input-area">
          <div class="category-container">
            <select id="modal-post-category">
              <option value="" disabled selected>Select Category</option>
              <option value="announcement">Announcement</option>
              <option value="event">Event</option>
              <option value="resource">Resource</option>
              <option value="discussion">Discussion</option>
            </select>
          </div>
          <input type="text" id="modal-post-title" placeholder="Title" maxlength="100">
          <textarea id="modal-post-content" class="modal-post-content" placeholder="What's on your mind?" style="resize: none;"></textarea>
          <div class="media-upload">
            <div class="media-buttons" style="display: flex; width: 100%; gap: 10px;">
              <button id="tap-to-upload" style="flex: 1;">
                <i class='bx bx-image-add' style="margin-right: 6px; font-size: 30px;"></i>
                <span>Tap to Upload</span>
              </button>
              <button id="add-web-url" style="flex: 1;">
               <i class='bx bx-iframe' style="margin-right: 6px; font-size: 30px;"></i>
               <span> Add Image from Web</span>
              </button>
            </div>
            <input type="file" id="modal-media-upload" accept="image/jpeg,image/png,video/mp4,video/webm" style="display: none;" multiple>
            <textarea id="modal-web-url-input" placeholder="Paste image URLs (one per line)" style="display: none; width: 100%; resize: none; margin-top: 10px;"></textarea>
            <p id="media-caption" style="font-size: 0.9em; color: #666;">Psst, heads up: You can upload up to 10 image files.</p>
            <div id="modal-media-preview"></div>
          </div>
        </div>
        <div class="modal-footer-container">
          <div class="modal-footer">
            <button id="modal-post-button" class="action-btn">Post</button>
            <div class="modal-post-buttons">
              <button class="post-option" data-type="text"><i class='bx bx-text'></i></button>
              <button class="post-option" data-type="image"><i class='bx bx-image'></i></button>
              <button class="post-option" data-type="video"><i class='bx bx-video'></i></button>
              <button class="post-option" data-type="link"><i class='bx bx-link'></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Share Modal -->
    <div id="share-post-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close-button" id="share-modal-close">×</span>
        <div class="modal-header-container">
          <div class="modal-header">
            <div class="modal-user-info">
              <strong id="share-modal-user-name"></strong>
              <small id="share-original-creator" style="color: black;"></small>
            </div>
          </div>
        </div>
        <div class="modal-input-area">
          <div class="category-container">
            <select id="share-modal-post-category">
              <option value="">No Category</option>
              <option value="announcement">Announcement</option>
              <option value="event">Event</option>
              <option value="resource">Resource</option>
              <option value="discussion">Discussion</option>
            </select>
          </div>
          <div id="share-post-content" class="share-post-content"></div>
          <textarea id="share-caption-input" class="share-caption-input" placeholder="Add a caption (optional)" style="resize: none;" maxlength="500"></textarea>
        </div>
        <div class="modal-footer">
          <button id="share-cancel-button" class="cancel-btn">Cancel</button>
          <button id="share-submit-button" class="action-btn">Share</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    fetch('../components/sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.querySelector('.sidebar-placeholder').innerHTML = data;
        const sidebarScript = document.createElement('script');
        sidebarScript.src = '../components/sidebar.js';
        sidebarScript.onload = function() {};
        document.querySelector('.sidebar-placeholder').appendChild(sidebarScript);
      })
      .catch(error => {
        console.error('Error loading sidebar:', error);
      });
  </script>

  <script src="../js/communityboard.js" defer></script>
</body>
</html>
