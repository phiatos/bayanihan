<!-- reliefrRequestOverview.html -->

<header>Reliefs Requests Overview</header>

<!-- Summary Dashboard -->
<div class="dashboard-cards">
    <div class="card">
        <div class="card-title">Total Relief Requests</div>
        <div class="card-value" id="total-requests">0</div>
    </div>
    <div class="card">
        <div class="card-title">Total Donations Needed</div>
        <div class="card-value" id="total-donations-needed">0</div>
    </div>
    <div class="card">
        <div class="card-title">Requests Completed</div>
        <div class="card-value" id="requests-completed">0</div>
    </div>
    <div class="card">
        <div class="card-title">Requests Pending</div>
        <div class="card-value" id="requests-pending">0</div>
    </div>
    <!-- <div class="card">
        <div class="card-title">Requests In Progress</div>
        <div class="card-value" id="requests-inprogress">0</div>
    </div> -->
    <div class="card">
        <div class="card-title">Total Remaining Donations</div>
        <div class="card-value" id="total-remaining">0</div>
    </div>
    <div class="card">
        <div class="card-title">Assigned Volunteers</div>
        <div class="card-value" id="total-assigned">0</div>
    </div>
</div>


<div id="previewModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span id="closeModal" class="close">×</span>
        <div id="modalContent"></div>
    </div>
</div>

<!-- Filters / Search -->
<div class="filters">
    <input type="text" placeholder="Search by ABVN Location or Category" id="search-input">
    <select id="status-filter">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Incomplete">Incomplete</option>
        <option value="Rejected">Rejected</option>
    </select>

    <select id="skills-filter">
        <option value="">All Categories</option>
        
    </select>

</div>

<!-- Requests Table -->
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>Contact Person</th>
                <th>Category</th>
                <th>ABVN Location</th>
                <th>Quantity Needed</th>
                <th>Quantity Donated</th>
                <th>Remaining</th>
                <th>Status</th>
                <th>Assigned Volunteers</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="requests-table">
            <!-- Rows will be populated dynamically from Firebase -->
        </tbody>
    </table>
</div>
