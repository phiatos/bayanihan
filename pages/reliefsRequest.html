<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../components/sidebar.css" />
  <link rel="stylesheet" href="../css/reliefsrequest.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"/>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <title>Bayanihan | Angat Buhay Disaster Relief Portal</title>
</head>
<body>
  <div class="form-page-container">
    <div class="sidebar-placeholder"></div>
<div id="form-main-content">
  <header>Request Relief</header>

  <!-- Page 1 -->
  <form id="form-page-1">
    <div class="form first">

      <!-- Left Column: Contact Info -->
      <div class="form-container-1">
        <span class="title">Contact Information</span>
        <div class="fields">

          <div class="input-field">
            <label for="contactPerson">Organization Name:</label>
            <input type="text" id="contactPerson" placeholder="Enter Name" required disabled/>
          </div>

          <div class="input-field">
            <label for="contactNumber">Contact Number:</label>
            <input type="tel" id="contactNumber" placeholder="Enter Mobile Number" maxlength="11" required disabled/>
          </div>

          <div class="input-field">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter Email" required disabled/>
          </div>

          <div class="input-field">
            <label for="address">Exact Drop-off Address:</label>
            <input type="text" id="address" placeholder="Enter Drop-off Address" required />
            <div class="pin-btn-wrapper">
              <button id="pinBtn" type="button">
                <i class='bx bx-map-pin'></i> Pin Location
              </button>
            </div>

              <input type="hidden" id="latitude" name="latitude">
              <input type="hidden" id="longitude" name="longitude">

          </div>

          <div class="input-field">
            <label for="category">Request Category</label>
            <select id="category" required>
              <option value="" disabled selected>Select Category</option>
              <option value="Relief Packs">Relief Packs</option>
              <option value="Hot Meals">Hot Meals</option>
              <option value="Hygiene Kits">Hygiene Kits</option>
              <option value="Drinking Water">Drinking Water</option>
              <option value="Rice Packs">Rice Packs</option>
              <option value="Others">Other Essentials</option>
            </select>
          </div>

        </div>
      </div>
      <!-- End Left Column -->

      <!-- Right Column: Requested Items -->
      <div class="form-container-2">
        <div class="top-bar">
          <span class="title">Requested Items</span>
        </div>

        <div class="fields" id="itemsContainer">

          <div class="input-field">
            <label for="itemName">Item Name</label>
            <input 
              list="itemNameList" 
              id="itemName" 
              name="itemName" 
              placeholder="Select or type item" 
              required 
              disabled
            />
            <datalist id="itemNameList">
              <option value="Rice">
              <option value="Canned Goods">
              <option value="Water Bottles">
              <option value="Blankets">
              <option value="Medicine Kits">
              <option value="Hygiene Packs">
              <option value="Others">
            </datalist>
          </div>

          <div class="input-field">
            <label>Quantity</label>
            <input type="number" id="quantity" placeholder="Enter Quantity" min="1" required disabled />
          </div>

          <div class="input-field">
            <label>Additional Notes</label>
            <input type="text" id="notes" placeholder="Enter Notes" maxlength="50" disabled />
          </div>

          <button id="addItemBtn" type="button" disabled class="addItemBtn">
            <i class='bx bx-plus-circle'></i> Add Item
          </button>

          <div class="table-responsive">
            <div class="table-container">
              <table id="itemsTable">
                <thead>
                  <tr>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Notes</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  <tr id="noEntriesRow">
                    <td colspan="4" style="text-align: center; padding: 20px; color: #888;">
                      No items added yet. Click 'Add Item' to begin.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>

        <button type="button" class="next-btn" id="nextBtn">Proceed</button>
      </div>
      <!-- End Right Column -->

    </div>
  </form>
  <!-- End Page 1 -->

  <!-- Page 2 -->
  <form id="form-page-2" style="display: none;">
    <div class="form second">

      <div class="form-container-1">
        <span class="title">Submission Preview</span>
        <div class="fields">

          <div class="preview-box">
            <h3>Contact Information</h3>
            <div id="previewContact"></div>
          </div>

          <div class="preview-box">
            <h3>Requested Items</h3>
            <div class="table-preview-container">
              <div class="table-container">
                <table class="preview-table">
                  <thead>
                    <tr>
                      <th id="itemname">Item Name</th>
                      <th id="qty">Quantity</th>
                      <th id="notes">Notes</th>
                    </tr>
                  </thead>
                  <tbody id="previewItemsTable">
                    <!-- Preview items will be added here -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>

      <div class="button-group">
        <button type="button" class="next-btn" id="backBtn">Back</button>
        <button type="submit" id="submitBtn" class="next-btn">Submit</button>
      </div>

    </div>
  </form>
  <!-- End Page 2 -->

</div>

<!-- Map Modal (moved outside form for better control) -->
<div id="mapModal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="closeBtn">×</span>
    <h2 style="text-align: center;">Pin Drop-off Address</h2>
    <input id="mapSearch" type="text" placeholder="Search location..." />
    <div id="map" style="width: 100%; height: 400px; margin-top:10px;"></div>
    <button id="confirmLocationBtn">Confirm Location</button>
  </div>
</div>
</div>


  <!-- Load sidebar and JS -->
  <script>
    fetch('../components/sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.querySelector('.sidebar-placeholder').innerHTML = data;
        const sidebarScript = document.createElement('script');
        sidebarScript.src = '../components/sidebar.js';
        document.querySelector('.sidebar-placeholder').appendChild(sidebarScript);
      })
      .catch(error => console.error('Error loading sidebar:', error));
  </script>

  <script src="../js/inactivity-detector.js"></script> 
  <script type="module" src="../js/reliefsrequest.js"></script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAAAu6BeQjIZ7H7beFbAsPWuKuORmh0wrk&libraries=places,marker"></script>
</body>
</html>
