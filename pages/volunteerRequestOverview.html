<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../components/sidebar.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/volunteerRequest.css" />
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'/>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Bayanihan | Angat Buhay Disaster Relief Portal</title>
</head>
<body>
    <div class="main-container">
        <div class="sidebar-placeholder"></div>
        <div id="main-content">
            <header>Volunteer Requests Overview</header>

            <!-- Summary Dashboard -->
            <div class="dashboard-cards">
                <div class="card">
                    <div class="card-title">Total Active Requests</div>
                    <div class="card-value" id="total-requests"></div>
                </div>
                <div class="card">
                    <div class="card-title">Volunteers Needed</div>
                    <div class="card-value" id="total-volunteers"></div>
                </div>
                <div class="card">
                    <div class="card-title">Requests Completed</div>
                    <div class="card-value" id="requests-completed"></div>
                </div>
                <div class="card">
                    <div class="card-title">Requests Pending</div>
                    <div class="card-value" id="requests-pending"></div>
                </div>
            </div>

            <!-- Filters / Search -->
            <div class="filters">
                <input type="text" placeholder="Search by ABVN or Task" id="search-input">
                <select id="status-filter">
                    <option value="">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
                <select id="skills-filter">
                    <option value="">All Skills</option>
                    <!-- populate dynamically -->
                </select>
            </div>

            <!-- Requests Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ABVN Name</th>
                            <th>Task Name</th>
                            <th>Required Skills</th>
                            <th>Volunteers Needed</th>
                            <th>Assigned</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requests-table">
                        <!-- Rows will be populated dynamically from Firebase -->
                    </tbody>
                </table>
            </div>

        </div>  
    </div>
    <script>
        fetch('../components/sidebar.html')
            .then(response => response.text())
            .then(data => {
                document.querySelector('.sidebar-placeholder').innerHTML = data;

                const sidebarScript = document.createElement('script');
                sidebarScript.src = '../components/sidebar.js'; 

                document.querySelector('.sidebar-placeholder').appendChild(sidebarScript);
            })
            .catch(error => {
                console.error('Error loading sidebar:', error);
            });
    </script>
    
    <script src="../js/volunteerRequestOverview.js"  type="module"></script>
</body>
</html>
